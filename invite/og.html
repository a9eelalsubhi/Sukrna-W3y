<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>صورة معاينة الدعوة</title>
<!-- source of og.jpg (the WhatsApp link preview). Render at 1200x630. -->
<style>
@font-face{font-family:"TS";src:url(../assets/fonts/thmanyahsans-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:"TS";src:url(../assets/fonts/thmanyahsans-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:"TSD";src:url(../assets/fonts/thmanyahserifdisplay-Black.woff2) format("woff2");font-weight:900}
html,body{margin:0;background:#070A26}
.og{position:relative;width:1200px;height:630px;overflow:hidden;color:#F4F7FF;font-family:"TS";
  background:radial-gradient(760px 480px at 100% -10%,rgba(28,111,224,.42),transparent 62%),radial-gradient(640px 460px at -5% 115%,rgba(204,51,139,.3),transparent 62%),#070A26}
.copy{position:absolute;right:80px;top:150px;width:640px}
.copy h1{margin:0;font-family:"TSD";font-weight:900;font-size:92px;line-height:1.05}
.copy h1 em{font-style:normal;color:#FF5DB1}
.copy p{margin:22px 0 0;font-size:30px;line-height:1.5;color:#C9D1EE}
.logos{position:absolute;right:80px;top:56px;display:flex;align-items:center;gap:22px}
.logos .me{height:58px}
.logos span{width:2px;height:40px;background:rgba(255,255,255,.25)}
.logos .p{height:64px}
/* the meter, tilted, its screen hiding the name */
.meter{position:absolute;left:96px;top:70px;width:340px;height:484px;border-radius:48px;transform:rotate(-7deg);
  background:linear-gradient(160deg,#2A7BEA 0%,#1250BC 36%,#14257A 78%,#1B1F5E 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.10),inset 0 18px 30px rgba(255,255,255,.12),inset 0 -24px 40px rgba(0,0,0,.35),0 40px 70px rgba(2,4,24,.6)}
.meter::before{content:"";position:absolute;inset:10px;border-radius:40px;border:1.5px dashed rgba(255,255,255,.14)}
.meter .brand{position:absolute;top:28px;left:0;right:0;text-align:center}
.meter .brand img{height:46px}
.lcd{position:absolute;left:28px;right:28px;top:104px;height:228px;border-radius:24px;overflow:hidden;color:#10224F;text-align:center;
  background:linear-gradient(170deg,#E9FFF4 0%,#CDEFE0 55%,#B9E4D2 100%);box-shadow:0 0 0 8px #0A1450,0 0 0 11px rgba(255,255,255,.14)}
.lcd small{display:block;margin-top:34px;font-size:18px;color:#9C1F62}
.lcd b{display:block;margin-top:6px;font-family:"TSD";font-weight:900;font-size:58px;line-height:1.1;filter:blur(9px);opacity:.75}
.lcd i{display:block;margin:14px auto 0;width:130px;height:10px;border-radius:5px;background:#1E4A3E;opacity:.2}
.grille{position:absolute;left:50%;top:362px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(7,9px);gap:10px 11px}
.grille span{width:9px;height:9px;border-radius:50%;background:rgba(4,8,40,.5)}
.grille span.p{background:#FF5DB1}
.port{position:absolute;bottom:0;left:50%;width:116px;height:32px;transform:translateX(-50%);border-radius:14px 14px 0 0;background:#0A1450}
.strip{position:absolute;left:50%;top:478px;width:52px;height:120px;transform:translateX(-50%);border-radius:0 0 10px 10px;background:linear-gradient(180deg,#F7F8FC,#DCE3F2)}
.strip::after{content:"";position:absolute;left:6px;right:6px;bottom:8px;height:24px;border-radius:6px;background:#CC338B}

</style>
</head>
<body>
<div class="og">
  <div class="meter">
    <div class="brand"><img src="../assets/logos/sukkarna-white.svg" alt=""></div>
    <div class="lcd"><small>النتيجة</small><b>اسمك هنا</b><i></i></div>
    <div class="grille"><span></span><span></span><span></span><span class="p"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="port"></div>
    <div class="strip"></div>
  </div>
  <div class="logos">
    <img class="me" src="../assets/logos/sukkarna-white.svg" alt="">
    <span></span><img class="p" src="../assets/logos/uqu-med-white.png" alt="">
  </div>
  <div class="copy">
    <h1>عندك دعوة<br><em>باسمك</em></h1>
    <p>افتح الرابط، ضع إصبعك على الجهاز، واقرأ النتيجة.</p>
  </div>
</div>
</body>
</html>
