<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مطوية سكّرنا وعي</title>
<meta name="description" content="مطوية حملة سكّرنا وعي: أنواع السكري، الأرقام المهمة، والتصرف الصحيح.">
<meta name="theme-color" content="#070A26">
<meta property="og:title" content="مطوية سكّرنا وعي 💙">
<meta property="og:description" content="أنواع السكري، الأرقام اللي لازم تعرفها، وكيف تتصرف.">
<meta property="og:image" content="https://a9eelalsubhi.github.io/Sukrna-W3y/brochure/outside.webp">
<link rel="icon" href="../assets/logos/icon.svg">
<style>
@font-face{font-family:"TS";src:url(../assets/fonts/thmanyahsans-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"TS";src:url(../assets/fonts/thmanyahsans-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"TSD";src:url(../assets/fonts/thmanyahserifdisplay-Black.woff2) format("woff2");font-weight:900;font-display:swap}
:root{--night:#070A26;--navy:#14257A;--pink2:#FF5DB1;--ink:#F4F7FF;--muted:#AEB7DA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--ink);font-family:"TS",Tahoma,sans-serif}
body{min-height:100svh;background:radial-gradient(900px 560px at 85% -10%,rgba(28,111,224,.3),transparent 62%),var(--night)}
main{width:min(100% - 32px,1100px);margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 0 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top .me{height:44px}
.top .pt{display:flex;align-items:center;gap:10px}
.top .pt img{height:46px;width:auto}
.top .pt i{width:1px;height:20px;background:rgba(255,255,255,.22)}
h1{margin:28px 0 0;font-family:"TSD";font-weight:900;font-size:clamp(34px,8vw,56px);line-height:1.1}
h1 em{font-style:normal;color:var(--pink2)}
.lead{margin:10px 0 0;font-size:16px;line-height:1.7;color:var(--muted)}
section{margin-top:28px}
h2{margin:0 0 12px;font-size:20px}
.sheet{display:block;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 20px 40px rgba(2,4,24,.5)}
.sheet img{display:block;width:100%;height:auto}
.hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.dl{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.dl a{flex:1 1 220px;display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:14px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700}
.dl a.sec{background:rgba(255,255,255,.1)}
</style>
</head>
<body>
<main>
  <header class="top">
    <img class="me" src="../assets/logos/sukkarna-white.svg" alt="سكّرنا وعي">
    <div class="pt"><img src="../assets/logos/uqu-med-white.png" alt="جامعة أم القرى، كلية الطب"></div>
  </header>
  <h1>المطوية<br><em>في جيبك</em></h1>
  <p class="lead">أنواع السكري، الأرقام اللي لازم تعرفها، وكيف تتصرف في الحالات الطارئة.</p>

  <section>
    <h2>الوجه الأول</h2>
    <a class="sheet" href="outside.webp"><img src="outside.webp" width="2690" height="1901" alt="الوجه الخارجي للمطوية: الغلاف، ما هو السكري، خرافة أم حقيقة"></a>
    <p class="hint">اضغط على الصورة لتكبيرها</p>
  </section>
  <section>
    <h2>الوجه الثاني</h2>
    <a class="sheet" href="inside.webp"><img src="inside.webp" width="2690" height="1901" alt="الوجه الداخلي للمطوية" loading="lazy"></a>
    <p class="hint">اضغط على الصورة لتكبيرها</p>
  </section>

  <div class="dl">
    <a href="outside.pdf" download>حمّل الوجه الأول PDF</a>
    <a class="sec" href="inside.pdf" download>حمّل الوجه الثاني PDF</a>
  </div>
</main>
</body>
</html>
