<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سكّرنا وعي — بخطوة وعي نواجه السكري</title>
<meta name="description" content="عرض تفاعلي توعوي عن داء السكري — كلية الطب، جامعة أم القرى">
<link rel="icon" href="assets/logos/icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Thmanyah Sans";src:url(assets/fonts/thmanyahsans-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url(assets/fonts/thmanyahsans-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url(assets/fonts/thmanyahsans-Black.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Thmanyah Serif";src:url(assets/fonts/thmanyahserifdisplay-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Serif";src:url(assets/fonts/thmanyahserifdisplay-Black.woff2) format("woff2");font-weight:900;font-display:swap}
:root{
  --night:#070A26; --galactic:#1B1F5E; --true:#0073CF; --sky:#4FB3FF; --pink:#CC338B; --pink2:#FF5DB1;
  --ink:#F4F7FF; --muted:#AEB7DA; --line:rgba(255,255,255,.10); --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --good:#2FD39A; --warn:#FFB547; --bad:#FF5A6E;
  --serif:"Thmanyah Serif","Thmanyah Sans",Tahoma,sans-serif; --sans:"Thmanyah Sans",Tahoma,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#viewport{position:fixed;inset:0;display:grid;place-items:center;background:
  radial-gradient(1200px 700px at 85% -10%,rgba(0,115,207,.35),transparent 60%),
  radial-gradient(900px 600px at 0% 110%,rgba(204,51,139,.22),transparent 60%),var(--night)}
#stage{position:relative;width:1600px;height:900px;transform-origin:center;flex:none}
.bgdrops{position:absolute;inset:0;pointer-events:none;opacity:.5}

/* ---------- chrome ---------- */
.dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.3px);background-size:34px 34px;-webkit-mask-image:radial-gradient(1000px 600px at 50% 40%,#000,transparent);mask-image:radial-gradient(1000px 600px at 50% 40%,#000,transparent)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.topbar{position:absolute;inset:0 0 auto 0;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 54px;z-index:20}
.brand img{height:58px}
.partners{display:flex;align-items:center;gap:26px}
.partners img{height:70px}
.partners .sep{width:1px;height:46px;background:rgba(255,255,255,.18)}
.bottombar{position:absolute;inset:auto 0 0 0;height:100px;display:flex;align-items:center;justify-content:space-between;padding:0 54px;z-index:20}
.track{display:flex;align-items:center;gap:16px}
.drops{display:flex;gap:9px;align-items:flex-end}
.drops svg{width:14px;height:18px;transition:.4s}
.drops svg path{fill:rgba(255,255,255,.16);transition:.4s}
.drops svg.on path{fill:var(--sky)}
.drops svg.cur{width:22px;height:28px}
.drops svg.cur path{fill:var(--pink2)}
.ttl{font-size:17px;color:var(--muted)}
.ttl b{color:#fff;font-family:var(--serif);font-size:22px;margin-inline-end:6px}
.ctrl{display:flex;align-items:center;gap:12px}
.nextc{position:relative;width:82px;height:82px;border-radius:50%;border:none;background:linear-gradient(140deg,var(--pink2),var(--pink));box-shadow:0 14px 34px rgba(204,51,139,.45);display:grid;place-items:center}
.nextc svg.icon{width:34px;height:34px;stroke-width:2.4}
.nextc .ring{position:absolute;inset:-9px;width:100px;height:100px;transform:rotate(-90deg)}
.nextc .ring circle{fill:none;stroke-width:4}
.nextc.restart{background:linear-gradient(140deg,var(--sky),var(--true));box-shadow:0 14px 34px rgba(0,115,207,.45)}
.ghost{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:transparent;display:grid;place-items:center;color:var(--muted)}
.ghost svg{width:20px;height:20px}
.ghost:disabled{opacity:.3}
.nextlbl{font-size:15px;color:var(--muted);max-width:230px;line-height:1.4}
.bignum{position:absolute;left:54px;top:4px;font-family:var(--serif);font-weight:900;font-size:150px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.09);pointer-events:none}
.panel{background:linear-gradient(165deg,#161C63,#0C1145);border-radius:30px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.25)}
.photo{display:block;object-fit:cover;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent 100%);mask-image:radial-gradient(closest-side,#000 72%,transparent 100%)}
.photo.soft{-webkit-mask-image:radial-gradient(70% 70% at 50% 45%,#000 60%,transparent 100%);mask-image:radial-gradient(70% 70% at 50% 45%,#000 60%,transparent 100%)}
/* ---------- slides ---------- */
.slide{position:absolute;inset:96px 0 100px 0;padding:10px 64px 0;display:none}
.slide.active{display:flex;flex-direction:column;justify-content:center;padding-bottom:24px;animation:slideIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:var(--pink2);letter-spacing:.01em}
.eyebrow::before{content:"";width:26px;height:3px;border-radius:3px;background:currentColor}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:900;line-height:1.25;text-wrap:balance}
h2{font-size:58px;margin-top:6px}
h2 em{font-style:normal;color:var(--pink2)}
h2 .blue{color:var(--sky)}
.lead{font-size:22px;color:var(--muted);margin:10px 0 0;max-width:62ch;line-height:1.7}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:22px}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.reveal.shown{opacity:1;transform:none}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:15px;font-weight:700;background:rgba(255,255,255,.08)}
.icon{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibox{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none;background:linear-gradient(140deg,rgba(79,179,255,.22),rgba(204,51,139,.18));border:1px solid var(--line);color:#fff}
.ibox .icon{width:30px;height:30px}
.act{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#0B0F3A;background:#FFD54F;padding:5px 12px;border-radius:10px}
.act svg{width:16px;height:16px}

/* cover */
.cover{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}
.cover h1{font-size:76px}
.cover h1 em{font-style:normal;color:var(--pink2)}
.cover .sub{font-size:28px;color:var(--muted);margin-top:14px;line-height:1.6}
.team{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px}
.team .pill{font-weight:400}
.team .pill b{font-weight:700}
#coverLogo{width:100%;filter:drop-shadow(0 30px 60px rgba(0,115,207,.35))}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}
.stat{position:relative;padding:30px;border-radius:26px;background:var(--glass);border:1px solid var(--line);overflow:hidden;min-height:360px;display:flex;flex-direction:column;justify-content:space-between}
.stat .big{font-family:var(--serif);font-weight:900;font-size:112px;line-height:1;color:#fff;direction:ltr;text-align:right}
.stat .big small{font-size:40px;color:var(--sky)}
.stat .lbl{font-size:22px;color:var(--muted)}
.stat .ring{position:absolute;left:-40px;top:-40px;width:200px;height:200px;border-radius:50%;border:26px solid rgba(79,179,255,.10)}
.stat.hidden .big{filter:blur(16px)}
.guess{margin-top:22px;display:flex;align-items:center;gap:16px;font-size:20px;color:var(--muted)}

/* insulin key scene */
.scene{width:100%;height:560px;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);overflow:hidden;position:relative}
.modes{display:flex;gap:10px;margin-top:20px}
.mode{padding:12px 20px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:18px;font-weight:700}
.mode.on{background:var(--true);border-color:transparent}
.explain{margin-top:18px;font-size:21px;line-height:1.7;color:var(--muted);min-height:110px}
.explain b{color:#fff}

/* who am I */
.whos{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px}
.who{border-radius:24px;background:var(--glass);border:1px solid var(--line);padding:24px;min-height:460px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.who .q{font-size:15px;font-weight:700;color:var(--warn)}
.who ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.who li{font-size:19px;line-height:1.5;padding-inline-start:28px;position:relative}
.who li::before{content:"؟";position:absolute;inset-inline-start:0;top:0;color:var(--sky);font-weight:900}
.who .ans{margin-top:auto;border-radius:18px;padding:16px;background:linear-gradient(135deg,var(--true),var(--galactic));font-size:18px;line-height:1.6;display:none}
.who.open .ans{display:block;animation:pop .5s}
.who .ans b{font-family:var(--serif);font-size:28px;display:block}
.who button.rv{margin-top:auto;padding:12px;border-radius:14px;border:1px dashed rgba(255,255,255,.3);background:transparent;font-size:17px;font-weight:700}
.who.open button.rv{display:none}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}

/* risk */
.risk{display:grid;grid-template-columns:1.25fr .75fr;gap:34px;margin-top:26px}
.factors{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.factor{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--glass);text-align:start;font-size:19px;font-weight:700;transition:.25s}
.factor small{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.factor.on{background:rgba(204,51,139,.22);border-color:var(--pink2)}
.factor .ibox{width:48px;height:48px}
.meter{border-radius:26px;padding:26px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.gaugeR{width:250px;height:150px}
.meter .verdict{font-size:22px;font-weight:700;line-height:1.5;min-height:66px}
.meter .note{font-size:14px;color:var(--muted)}

/* symptoms hunt */
.hunt{display:grid;grid-template-columns:1.35fr .65fr;gap:26px;margin-top:20px}
.room{position:relative;height:590px;border-radius:28px;overflow:hidden;border:1px solid var(--line)}
.room svg{width:100%;height:100%;display:block}
.hot{cursor:pointer}
.hot .halo{fill:rgba(255,213,79,.0);stroke:rgba(255,213,79,0);stroke-width:4;transition:.3s}
.hot.found .halo{fill:rgba(47,211,154,.18);stroke:var(--good)}
.hot:hover .halo{stroke:rgba(255,213,79,.6)}
.found-list{display:flex;flex-direction:column;gap:10px}
.fl{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);font-size:18px;opacity:.35;transition:.4s}
.fl.found{opacity:1;border-color:rgba(47,211,154,.5)}
.fl .n{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-weight:900}
.fl.found .n{background:var(--good);color:#06301F}
.score{font-family:var(--serif);font-size:40px;font-weight:900}

/* glucose meter */
.gm{display:grid;grid-template-columns:.9fr 1.1fr;gap:34px;margin-top:22px;align-items:start}
.device{position:relative;width:300px;height:470px;transform:scale(.88);transform-origin:top center;margin-inline:auto;border-radius:60px;background:linear-gradient(160deg,#2A6BD8,#173C8F);box-shadow:inset 0 0 0 10px rgba(255,255,255,.08),0 40px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;padding-top:44px}
.screen{width:250px;height:200px;border-radius:26px;background:#CFE8D8;color:#11312A;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 6px 20px rgba(0,0,0,.25)}
.screen .val{font-family:"Courier New",monospace;font-weight:900;font-size:84px;letter-spacing:-2px;direction:ltr}
.screen .u{font-size:16px;font-weight:700;direction:ltr}
.screen .tag{font-size:15px;margin-top:4px}
.device .btns{display:flex;gap:26px;margin-top:40px}
.device .btns i{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.15);display:block}
.device .strip{position:absolute;bottom:-70px;width:44px;height:110px;border-radius:8px;background:linear-gradient(#F4F4F4,#DADADA);box-shadow:0 10px 20px rgba(0,0,0,.3)}
.device .strip::after{content:"";position:absolute;bottom:12px;left:12px;width:20px;height:20px;border-radius:50%;background:var(--pink)}
.tabs{display:flex;gap:10px}
.tab{padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:18px;font-weight:700}
.tab.on{background:var(--true);border-color:transparent}
.range{margin-top:22px}
.bar{position:relative;height:26px;border-radius:999px;display:flex;overflow:hidden;direction:ltr}
.bar span{display:block;height:100%}
.ticks{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin-top:8px;direction:ltr}
input[type=range]{width:100%;margin-top:18px;accent-color:var(--pink2);height:30px;direction:ltr}
.verdict2{margin-top:16px;padding:18px 20px;border-radius:18px;font-size:22px;font-weight:700;display:flex;gap:12px;align-items:center}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.legend div{border-radius:16px;padding:14px;background:var(--glass);border:1px solid var(--line);font-size:16px;line-height:1.6}
.legend b{display:block;font-size:18px}
.challenge{margin-top:18px;display:flex;gap:10px;align-items:center;font-size:18px;color:var(--muted)}

/* emergency */
.em{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:22px}
.story{border-radius:26px;padding:26px;background:var(--glass);border:1px solid var(--line)}
.story .who2{display:flex;gap:16px;align-items:center}
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(140deg,#FFB86B,#FF7A59);display:grid;place-items:center;flex:none}
.story p{font-size:21px;line-height:1.7;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.chip{padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:18px;font-weight:700}
.chip.ok{background:rgba(47,211,154,.2);border-color:var(--good)}
.chip.no{background:rgba(255,90,110,.18);border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}
.feedback{margin-top:14px;font-size:19px;line-height:1.6;min-height:60px;color:var(--muted)}
.rule{display:flex;gap:16px;align-items:center;margin-top:8px}
.rule .clock{width:200px;height:200px;flex:none}
.steps15{display:flex;flex-direction:column;gap:10px;font-size:19px}
.steps15 div{display:flex;gap:12px;align-items:center}
.steps15 b{width:36px;height:36px;border-radius:10px;background:var(--pink);display:grid;place-items:center;flex:none}
.alert{margin-top:16px;border-radius:18px;padding:16px 18px;background:rgba(255,90,110,.14);border:1px solid rgba(255,90,110,.5);font-size:18px;line-height:1.7}
.alert b{color:#FFB3BD}

/* body map */
.body{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px;margin-top:14px;align-items:start}
.bodyfig{height:640px}
.bodyfig svg{height:100%;width:100%}
.organ{cursor:pointer}
.organ circle.pulse{fill:var(--pink2);opacity:.25;transform-box:fill-box;transform-origin:center;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.6);opacity:0}}
.ocards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ocard{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;background:var(--glass);border:1px solid var(--line);transition:.3s}
.ocard h3{font-family:var(--sans);font-size:20px;font-weight:700;margin-bottom:4px}
.ocard p{margin:0;font-size:16px;color:var(--muted);line-height:1.6}
.ocard.hl{border-color:var(--pink2);background:rgba(204,51,139,.16);transform:translateX(-6px)}
.foot{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}

/* myths */
.myths{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:26px}
.myth{height:250px;perspective:1200px}
.myth .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.myth.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.front{background:var(--glass)}
.front .num{font-family:var(--serif);font-size:20px;color:var(--sky);font-weight:900}
.front p{font-size:20px;font-weight:700;line-height:1.5;margin:0}
.front .vote{margin-top:auto;display:flex;gap:8px}
.front .vote span{flex:1;text-align:center;padding:8px;border-radius:12px;background:rgba(255,255,255,.07);font-size:15px;font-weight:700}
.back{transform:rotateY(180deg);background:linear-gradient(150deg,#2A1240,#1B1F5E)}
.back .badge{align-self:flex-start;font-weight:900;font-size:15px;padding:6px 12px;border-radius:10px;background:var(--bad);color:#fff}
.back p{margin:0;font-size:17px;line-height:1.6}

/* living */
.living{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px}
.ltabs{display:flex;gap:10px}
.tips{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.tip{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--line);font-size:19px;animation:pop .4s both}
.bag{border-radius:26px;padding:22px;background:var(--glass);border:1px solid var(--line)}
.bagzone{height:200px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.bagzone svg{height:200px}
.packed{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;width:240px;justify-content:center}
.packed span{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--galactic);animation:drop .5s cubic-bezier(.3,1.5,.5,1)}
.packed span svg{width:24px;height:24px}
@keyframes drop{from{transform:translateY(-120px)}to{transform:none}}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:15px;font-weight:700;text-align:center}
.item .icon{width:34px;height:34px}
.item.used{opacity:.25;pointer-events:none}
.item.no{animation:shake .4s;border-color:var(--bad)}

/* prevention */
.path{position:relative;height:330px;margin-top:20px}
.path svg.road{position:absolute;inset:0;width:100%;height:100%}
.stepn{position:absolute;width:250px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.stepn .disc{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--true),var(--galactic));border:3px solid rgba(255,255,255,.25);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.stepn .disc .icon{width:44px;height:44px}
.stepn b{font-size:20px;background:var(--night);padding:2px 10px;border-radius:10px}
.stepn small{font-size:15px;color:var(--muted);line-height:1.5;background:var(--night);padding:2px 8px;border-radius:8px}
.checks{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:20px}
.check{border-radius:18px;padding:16px 10px;text-align:center;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px}
.check b{font-size:17px}
.check small{font-size:14px;color:var(--sky);font-weight:700}

/* end */
.end{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.wheelbtn{margin-top:26px;display:inline-flex;align-items:center;gap:14px;padding:20px 30px;border-radius:20px;border:none;font-size:24px;font-weight:900;background:linear-gradient(135deg,#FFD54F,#FFB547);color:#2A1500;box-shadow:0 16px 40px rgba(255,181,71,.35)}
.wheelbtn svg{width:30px;height:30px}
.sources{margin-top:24px;font-size:15px;color:var(--muted);line-height:1.8}

/* wheel modal */
.modal{position:fixed;inset:0;background:rgba(4,6,24,.86);backdrop-filter:blur(8px);display:none;place-items:center;z-index:100}
.modal.open{display:grid}
.wheelbox{width:min(1200px,94vw);display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center}
.wheelwrap{position:relative;width:min(520px,44vw);aspect-ratio:1}
#wheel{width:100%;height:100%;transition:transform 4.5s cubic-bezier(.12,.8,.12,1)}
.pointer{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:44px solid #FFD54F;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.spin{position:absolute;inset:0;margin:auto;width:28%;height:28%;border-radius:50%;border:6px solid #fff;background:var(--pink);font-size:clamp(16px,1.8vw,24px);font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.qpanel{border-radius:28px;padding:30px;background:rgba(255,255,255,.06);border:1px solid var(--line);min-height:360px;display:flex;flex-direction:column;gap:16px}
.qpanel .qk{font-size:16px;color:var(--warn);font-weight:700}
.qpanel .qt{font-family:var(--serif);font-size:clamp(24px,2.4vw,36px);font-weight:900;line-height:1.4}
.qpanel .qa{font-size:clamp(18px,1.6vw,22px);line-height:1.7;padding:16px 18px;border-radius:16px;background:rgba(47,211,154,.14);border:1px solid rgba(47,211,154,.5);display:none}
.qpanel .qa.show{display:block;animation:pop .4s}
.qactions{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}
.close{position:absolute;top:24px;left:24px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:120}

/* notes */
.notes{position:fixed;bottom:0;inset-inline:0;max-height:40vh;overflow:auto;background:#0D1240;border-top:1px solid var(--line);padding:18px 28px;font-size:18px;line-height:1.8;z-index:90;display:none}
.notes.open{display:block}
.notes h4{margin:0 0 6px;color:var(--pink2);font-size:15px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#fff;color:var(--galactic);padding:12px 20px;border-radius:14px;font-weight:700;font-size:16px;z-index:130;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.help{position:fixed;inset:0;display:none;place-items:center;background:rgba(4,6,24,.8);z-index:110}
.help.open{display:grid}
.help .card{max-width:560px;font-size:18px;line-height:1.9}
kbd{font-family:inherit;background:rgba(255,255,255,.12);border-radius:6px;padding:1px 8px;font-size:15px}

/* ---------- v2 additions ---------- */
.cover{grid-template-columns:1fr 1fr}
.cover h1{font-size:64px}
.coverimg img{width:100%;max-width:640px;margin-inline:auto;aspect-ratio:1}
.statsrow{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:end;margin-top:20px}
.statsrow .stats{margin-top:0}
.famimg{width:100%;aspect-ratio:1}
.stat-top{display:flex;justify-content:space-between;align-items:center}
.stat .lbl{transition:.4s}
.stat.hidden .lbl{color:var(--warn);font-weight:700}
.mode,.tab{cursor:default}
.who{padding-top:14px;min-height:540px;border:none}
.whoimg{width:170px;height:170px;margin-inline:auto;margin-bottom:-6px}
.who .ans{display:none}
.who.open .ans{display:block}
.who .qmark{margin-top:auto;height:86px;border-radius:18px;border:2px dashed rgba(255,255,255,.18);display:grid;place-items:center;font-family:var(--serif);font-size:54px;color:rgba(255,255,255,.35)}
.who.open .qmark{display:none}
.factor{opacity:.18;transform:none;border:none;background:linear-gradient(165deg,#161C63,#0C1145)}
.factor.shown{opacity:1;box-shadow:0 0 0 2px var(--warn) inset}
.factor.reveal{transform:none}
.meter{justify-content:center;min-height:420px}
.handwrap{display:flex;flex-direction:column;align-items:center;gap:10px;animation:wave 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wave{50%{transform:rotate(-12deg)}}
.bigv{font-family:var(--serif);font-size:46px;font-weight:900;color:#fff;margin-bottom:6px}
.huntscore{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:18px;color:var(--warn);font-weight:700}
.room{border:none}
.hot .halo{fill:rgba(255,213,79,0);stroke:rgba(255,213,79,0)}
.hot.found .halo{fill:rgba(47,211,154,.16);stroke:var(--good);stroke-width:5}
.hot.now .halo{animation:halo 1s ease-out}
@keyframes halo{from{stroke-width:30;stroke-opacity:0}to{stroke-width:5;stroke-opacity:1}}
.fl.now{transform:translateX(-8px)}
.range{position:relative}
.marker{position:absolute;top:-10px;width:6px;height:46px;border-radius:4px;background:#fff;box-shadow:0 0 0 3px var(--night);transition:left .8s cubic-bezier(.2,.8,.2,1);transform:translateX(-50%);display:none}
.ticks{direction:ltr}
.challenge{font-size:18px;color:var(--muted)}
.challenge .rd{display:flex;gap:8px;align-items:center}
.challenge .rd i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;background:rgba(255,255,255,.08)}
.challenge .rd i.on{background:var(--pink)}
.story{border:none}
.emimg{position:relative;width:170px;height:170px;flex:none}
.emimg img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .8s}
.chip{cursor:default}
.chip.dim{opacity:.4;text-decoration:line-through}
.alert.reveal,.feedback.reveal,.steps15.reveal{transform:none}
.ocard{border:1px solid transparent}
.footrow{display:flex;gap:16px;align-items:center;margin-top:16px}
.footrow img{width:150px;height:150px;flex:none}
.myth.cur .front{box-shadow:0 0 0 3px var(--warn) inset;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--warn) inset,0 0 30px rgba(255,213,79,.35)}}
.front{background:linear-gradient(165deg,#161C63,#0C1145);border:none}
.living{grid-template-columns:1.1fr .9fr}
.liverow{display:grid;grid-template-columns:210px 1fr;gap:14px;align-items:start;margin-top:14px}
.liverow img{width:210px;height:210px;transition:opacity .4s}
.liverow .tips{margin-top:0}
.tip{background:linear-gradient(165deg,#161C63,#0C1145);border:none;font-size:18px;padding:12px 14px}
.bag{border:none}
.bagtop{display:flex;justify-content:space-between;align-items:center}
.items{grid-template-columns:repeat(3,1fr)}
.item{cursor:default;transition:.3s}
.item.cur{box-shadow:0 0 0 3px var(--warn) inset;transform:scale(1.04)}
.item.ok{opacity:.3}
.item.no{border-color:var(--bad);background:rgba(255,90,110,.16);opacity:.6}
.stepn img.disc{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.2);box-shadow:0 14px 30px rgba(0,0,0,.35);background:#0C1145}
.stepn:nth-of-type(5) img.disc{border-color:var(--pink2)}
.check{border:none}
.endimg img{width:100%;max-width:560px;aspect-ratio:1;margin-inline:auto}
.restartnote{margin-top:24px;display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:16px;background:rgba(79,179,255,.14);color:#CFE6FF;font-size:17px;font-weight:700}
.restartnote svg{width:22px;height:22px}
.sources{color:#C2C9E6}
/* ---------- v3: cover hero + signs ---------- */
.coverslide.active{justify-content:center;align-items:center}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.halo{position:absolute;width:760px;height:760px;left:50%;top:44%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(0,115,207,.32),rgba(204,51,139,.10) 60%,transparent);pointer-events:none}
.herologo{position:relative;width:min(980px,100%)}
.herologo svg{width:100%;display:block;overflow:visible}
.hero .sub{position:relative;font-size:26px;color:#C9D0EE;margin-top:6px;max-width:44ch;line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.signs{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:22px}
.sign{margin:0;position:relative;border-radius:26px;overflow:hidden;background:#0C1145;height:300px;display:flex;flex-direction:column;transition:transform .4s,box-shadow .4s,opacity .4s}
.sign img{width:100%;flex:1;min-height:0;object-fit:cover;object-position:50% 30%}
.sign figcaption{padding:12px 14px;font-size:20px;font-weight:700;background:#161C63;min-height:58px;display:flex;align-items:center;gap:10px}
.sign .sa{display:none}
.sign .sq{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-family:var(--serif);font-size:20px;flex:none}
.sign.found .sa{display:inline}
.sign.found .sq{background:var(--good);color:#06301F;font-size:0}
.sign.found .sq::before{content:"✓";font-size:18px}
.sign.found figcaption{background:linear-gradient(90deg,rgba(47,211,154,.22),#161C63)}
.sign.cur{box-shadow:0 0 0 4px var(--warn);transform:translateY(-6px)}
.sign.cur figcaption{color:var(--warn)}
.sign:not(.found):not(.cur):not(.more){opacity:.72}
.sign.more{padding:22px;justify-content:center;gap:10px;background:linear-gradient(165deg,#22145A,#0C1145)}
.sign.more b{font-family:var(--serif);font-size:30px}
.sign.more p{margin:0;font-size:18px;line-height:1.6;color:#C9D0EE}
.sign.more .doc{color:var(--warn);font-weight:700}
.sign.more .score{font-family:var(--serif);font-size:40px;font-weight:900;margin-top:auto}
/* ---------- portrait (vertical) stage 900x1600 ---------- */
body.portrait #stage{width:900px;height:1600px}
body.portrait .topbar{height:110px;padding:0 32px}
body.portrait .brand img{height:50px}
body.portrait .partners{gap:16px}
body.portrait .partners img{height:56px}
body.portrait .bottombar{height:132px;padding:0 32px}
body.portrait .nextlbl{display:none}
body.portrait .drops{gap:6px}
body.portrait .ttl{font-size:15px}
body.portrait .slide{inset:110px 0 132px 0;padding:6px 36px 0}
body.portrait .bignum{font-size:110px;left:30px;top:10px}
body.portrait h2{font-size:46px}
body.portrait .lead{font-size:20px}
body.portrait .cols,body.portrait .cover,body.portrait .end,body.portrait .em,body.portrait .living,
body.portrait .risk,body.portrait .gm,body.portrait .body,body.portrait .statsrow,body.portrait .hunt{grid-template-columns:1fr;gap:18px}
/* cover */
body.portrait .halo{width:620px;height:620px}
body.portrait .hero .sub{font-size:24px}
/* numbers */
body.portrait .stats{grid-template-columns:1fr;gap:14px}
body.portrait .stat{min-height:0;padding:22px;flex-direction:row;align-items:center;gap:18px}
body.portrait .stat-top{flex-direction:column;gap:8px}
body.portrait .stat .big{font-size:80px;text-align:right}
body.portrait .famimg{width:300px;margin-inline:auto;order:-1}
/* insulin */
body.portrait .scene{height:520px}
body.portrait .explain{min-height:0}
/* who */
body.portrait .whos{grid-template-columns:1fr;gap:14px;margin-top:16px}
body.portrait .who{min-height:0;display:grid;grid-template-columns:150px 1fr;column-gap:16px;padding:16px}
body.portrait .whoimg{width:150px;height:150px;grid-row:span 3;margin:0}
body.portrait .who ul{gap:4px}
body.portrait .who li{font-size:17px}
body.portrait .who .qmark{height:52px;font-size:34px;margin-top:8px}
body.portrait .who .ans{font-size:16px;padding:12px}
/* risk */
body.portrait .meter{min-height:280px}
/* signs */
body.portrait .signs{grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
body.portrait .sign{height:248px}
body.portrait .cols{grid-template-columns:1fr!important}
body.portrait .sign.more{height:auto}
/* meter */
body.portrait .gm .device{transform:scale(.72);margin-bottom:-120px}
/* emergency */
body.portrait .story{padding:20px}
/* body */
body.portrait .bodyfig{height:380px}
body.portrait .ocards{grid-template-columns:repeat(2,1fr)}
body.portrait .footrow img{width:110px;height:110px}
/* myths */
body.portrait .myths{grid-template-columns:repeat(2,1fr);gap:14px}
body.portrait .myth{height:220px}
/* living */
body.portrait .liverow{grid-template-columns:150px 1fr}
body.portrait .liverow img{width:150px;height:150px}
/* prevention */
body.portrait .path{height:auto;display:flex;flex-direction:column;gap:10px;margin-top:14px}
body.portrait .path svg.road{display:none}
body.portrait .stepn{position:static!important;width:auto;flex-direction:row;text-align:start;gap:16px}
body.portrait .stepn img.disc{width:96px;height:96px}
body.portrait .stepn b,body.portrait .stepn small{background:none;padding:0}
body.portrait .stepn.reveal:not(.shown){opacity:.18}
body.portrait .checks{grid-template-columns:repeat(3,1fr)}
/* end */
body.portrait .endimg img{max-width:420px}
body.portrait .end h2{font-size:58px!important}
/* ---------- room scene ---------- */
.roomwrap{display:grid;grid-template-columns:1fr 330px;gap:22px;margin-top:16px;align-items:start}
.scene3d{position:relative;width:100%;max-width:880px;aspect-ratio:3/2;border-radius:28px;overflow:hidden;justify-self:end}
.scene3d img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene3d .spot{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;z-index:2}
.pin .pn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:20px;background:var(--good);color:#06301F;box-shadow:0 0 0 4px rgba(5,7,32,.6);flex:none}
.pin .pl{display:none;flex-direction:column;background:rgba(9,12,52,.92);border-radius:16px;padding:8px 14px;white-space:nowrap}
.pin .pl b{font-size:20px}
.pin .pl small{font-size:14px;color:#C9D0EE}
.pin.found{opacity:1}
.pin.cur{z-index:3}
.pin.cur .pn{background:var(--warn);color:#3A2600;width:48px;height:48px;font-size:24px}
.pin.cur .pl{display:flex;animation:pop .45s}
.roomside{display:flex;flex-direction:column;gap:12px}
.roomcount{font-family:var(--serif);font-weight:900;font-size:84px;line-height:1}
.roomcount small{font-size:40px;color:var(--muted)}
.roomask{margin:0;font-size:21px;font-weight:700;color:var(--warn);line-height:1.5}
.roomfound{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.roomfound li{display:flex;align-items:center;gap:10px;font-size:19px;padding:9px 12px;border-radius:14px;background:linear-gradient(165deg,#161C63,#0C1145);animation:pop .4s}
.roomfound li b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#06301F;font-size:15px;flex:none}
.roomfound li.now b{background:var(--warn);color:#3A2600}
.roommore{margin:4px 0 0;font-size:15px;color:var(--muted);line-height:1.6}
body.portrait .roomwrap{grid-template-columns:1fr}
body.portrait .scene3d{max-width:none}
body.portrait .roomside{display:grid;grid-template-columns:auto 1fr;column-gap:18px;align-items:start}
body.portrait .roomfound{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}
body.portrait .roommore{grid-column:1/-1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
